[project]
name = "robotics-manipulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "mani-skill>=3.0.1",
    "pin>=4.1.0",
    "sapien>=3.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "tyro>=1.0.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
